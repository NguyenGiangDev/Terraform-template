# ─── terraform-apply.yml ──────────────────────────────────────────────────────
# Mục đích: Deploy toàn bộ ECS infrastructure (IAM, SG, Task Def, TG, ALB Rule, ECS Service)
# Chạy: Tự động khi push lên main (staging) / tạo tag vX.X.X (production - manual approve)
# Yêu cầu: ECR đã được tạo trước (chạy terraform-ecr-apply.yml)

on:
  push:
    branches: [main]
  release:
    types: [published]    # Tạo tag vX.X.X → trigger production deploy
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "stg"
        type: choice
        options: [stg, prod, test]
      image_tag:
        description: "Image tag (default: commit SHA)"
        required: false

env:
  TF_VERSION: "1.9.0"
  TF_DIR: "${{ github.workspace }}/.tf-deploy"
  APP_NAME: ${{ vars.APP_NAME }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENV: ${{ inputs.environment || (github.event_name == 'release' && 'prod' || 'stg') }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  deploy:
    name: "Terraform — Deploy ECS"
    runs-on: ubuntu-latest
    environment: ${{ env.ENV }}

    # Production release luôn yêu cầu manual approve (cấu hình trong GitHub Environment)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ── Copy đúng các file cần thiết vào thư mục làm việc ──────────────────
      # Core files: backend.tf, locals.tf, main.tf, variables.tf, providers.tf
      # Template files: TẤT CẢ file trong templates/ NGOẠI TRỪ ecr.tf
      #   (ecr.tf không copy vì ECR đã tồn tại — tránh Terraform quản lý lại)
      - name: Prepare Terraform workspace
        run: |
          mkdir -p $TF_DIR
          cp backend.tf locals.tf main.tf variables.tf providers.tf manifest.json $TF_DIR/
          for f in templates/*.tf; do
            [ "$(basename $f)" != "ecr.tf" ] && cp $f $TF_DIR/
          done

      # Terraform init: bucket/region/encrypt đã có trong backend.tf
      # Chỉ inject key vì chứa APP_NAME và ENV (dynamic theo môi trường)
      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="key=${{ env.APP_NAME }}/${{ env.ENV }}/terraform.tfstate"

      - name: Read ECR URLs from state
        id: ecr-urls
        working-directory: ${{ env.TF_DIR }}
        run: |
          ECR_URLS=$(terraform output -json ecr_repository_urls)
          echo "app_repo_url=$(echo $ECR_URLS | jq -r '.app')"     >> $GITHUB_OUTPUT
          echo "nginx_repo_url=$(echo $ECR_URLS | jq -r '.nginx')" >> $GITHUB_OUTPUT

      - name: Terraform Plan & Apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var="app_name=${{ env.APP_NAME }}" \
            -var="environment=${{ env.ENV }}" \
            -var="env=${{ env.ENV }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="vpc_id=${{ secrets.VPC_ID }}" \
            -var="private_subnet_ids=${{ secrets.PRIVATE_SUBNET_IDS }}" \
            -var="public_subnet_ids=${{ secrets.PUBLIC_SUBNET_IDS }}" \
            -var="ecs_cluster_id=${{ secrets.ECS_CLUSTER_ID }}" \
            -var="ecs_cluster_name=${{ secrets.ECS_CLUSTER_NAME }}" \
            -var="alb_listener_arn=${{ secrets.ALB_LISTENER_ARN }}" \
            -var="alb_security_group_id=${{ secrets.ALB_SECURITY_GROUP_ID }}" \
            -var="app_repository_url=${{ steps.ecr-urls.outputs.app_repo_url }}" \
            -var="nginx_repository_url=${{ steps.ecr-urls.outputs.nginx_repo_url }}" \
            -var="image_tag=${{ env.IMAGE_TAG }}" \
            -out=tfplan
          terraform apply -auto-approve tfplan
