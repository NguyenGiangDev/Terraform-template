# ─── terraform-ecr-apply.yml ──────────────────────────────────────────────────
# Mục đích: Tạo ECR repos → Build & Push Docker images
# Chạy: Thủ công từ GitHub Actions UI (Actions → workflow → Run workflow)
# Yêu cầu GitHub Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Yêu cầu GitHub Variables: AWS_REGION, APP_NAME

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "stg"
        type: choice
        options: [stg, prod, test]
      app_name:
        description: "Application name (ECR repo prefix)"
        required: true
        default: "web"
        type: string
      aws_region:
        description: "AWS region"
        required: false
        default: "ap-southeast-1"
        type: string

env:
  TF_VERSION: "1.9.0"
  TF_DIR: "${{ github.workspace }}/.tf-ecr"
  APP_NAME: ${{ inputs.app_name }}
  ENV: ${{ inputs.environment }}
  AWS_REGION: ${{ inputs.aws_region }}

jobs:
  ecr-deploy:
    name: "ECR — Provision & Push"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ── Copy đúng các file cần thiết vào thư mục làm việc ──────────────────
      # Core files: backend.tf, locals.tf, main.tf, variables.tf, providers.tf
      # ECR file:   templates/ecr.tf (copy vào cùng cấp với core files)
      # → Terraform chỉ "thấy" ECR resources, không thấy ECS/service/alb-rule
      - name: Prepare Terraform workspace
        run: |
          mkdir -p $TF_DIR
          cp backend.tf locals.tf main.tf variables.tf providers.tf manifest.json $TF_DIR/
          cp templates/ecr.tf $TF_DIR/

      # Terraform init: bucket/region/encrypt đã có trong backend.tf
      # Chỉ inject key vì chứa APP_NAME và ENV (dynamic theo môi trường)
      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="key=${{ env.ENV }}/${{ env.APP_NAME }}/terraform.tfstate"

      - name: Terraform Plan & Apply (ECR)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var="app_name=${{ env.APP_NAME }}" \
            -var="environment=${{ env.ENV }}" \
            -var="env=${{ env.ENV }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan-ecr
          terraform apply -auto-approve tfplan-ecr

      - name: Read ECR output URLs
        id: ecr-urls
        working-directory: ${{ env.TF_DIR }}
        run: |
          ECR_URLS=$(terraform output -json ecr_repository_urls)
          echo "app_repo_url=$(echo $ECR_URLS | jq -r '.app')"     >> $GITHUB_OUTPUT
          echo "nginx_repo_url=$(echo $ECR_URLS | jq -r '.nginx')" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push app image
        env:
          APP_REPO: ${{ steps.ecr-urls.outputs.app_repo_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile -t $APP_REPO:$IMAGE_TAG -t $APP_REPO:latest .
          docker push $APP_REPO:$IMAGE_TAG
          docker push $APP_REPO:latest

      - name: Build & Push nginx image
        env:
          NGINX_REPO: ${{ steps.ecr-urls.outputs.nginx_repo_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f nginx/Dockerfile -t $NGINX_REPO:$IMAGE_TAG -t $NGINX_REPO:latest .
          docker push $NGINX_REPO:$IMAGE_TAG
          docker push $NGINX_REPO:latest
